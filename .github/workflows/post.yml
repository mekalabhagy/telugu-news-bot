name: post-news

# Times are UTC. These are 07:30, 12:30, 18:30 and 21:00 IST.
on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries for Telugu text shaping
        run: sudo apt-get update && sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b
      - run: pip install -r requirements.txt
      - name: Fetch, write and queue/publish
        env:
          POST_MODE: ${{ vars.POST_MODE || 'review' }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '2' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
        run: python main.py run
      - name: Save state (dedupe database and review queue)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state queue
          git diff --cached --quiet || (git commit -m "state $(date -u +%F_%H%M)" && git push)
